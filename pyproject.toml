[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thefuck"
version = "0.2.0"
description = "A private practice package for MSDS610"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "399441537", email = "1zhengfra@gmail.com" },
]
license = { text = "MIT" }
keywords = ["msds610", "example", "private"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
thefuck = "thefuck.cli:main"

[project.urls]
Homepage = "https://github.com/399441537/msds610"
Repository = "https://github.com/399441537/msds610.git"

[tool.setuptools.packages.find]
where = ["src"]
